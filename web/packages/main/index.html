<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeTerm</title>
    <!-- 壳层样式必须走外链而非内联 style 标签:Tauri 会给内联 style 注入 nonce 到 CSP,
         有 nonce 时浏览器忽略 'unsafe-inline',xterm DOM 渲染器运行时注入的样式会被拦截。 -->
    <link rel="stylesheet" href="/src/shell.css" />
    <script>
      // 启动闪屏修复:JS bundle / IPC 还没回来之前,先用上次主题的 bg 上色,
      // 避免 dev 模式下 Vite 串行 fetch 期间纯色空屏。applyShellTheme 每次
      // 把新 bg 写回此 key。
      try {
        var cached = localStorage.getItem("vibeterm.theme.bg");
        if (cached) document.documentElement.style.setProperty("--color-bg", cached);
        var cs = localStorage.getItem("vibeterm.theme.appearance");
        if (cs === "light") document.documentElement.style.colorScheme = "light";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
